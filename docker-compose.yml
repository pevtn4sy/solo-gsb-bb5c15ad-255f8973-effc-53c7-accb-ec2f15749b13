services:
  api:
    build: .
    image: sample-traceability-api:latest
    container_name: sample-traceability-api
    ports:
      - "8000:8000"
    volumes:
      - sample-data:/data
    environment:
      SAMPLE_DB_PATH: /data/samples.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  sample-data:
